<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — To-Do Manager</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ░░ SIDEBAR ░░ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">✦</span>
      <h1 class="brand-name">To-Do List</h1>
    </div>

    <nav class="filter-nav">
      <button class="filter-btn active" data-filter="all">
        <span class="filter-icon">◈</span> All Tasks
        <span class="filter-count" id="count-all">0</span>
      </button>
      <button class="filter-btn" data-filter="pending">
        <span class="filter-icon">◉</span> Pending
        <span class="filter-count" id="count-pending">0</span>
      </button>
      <button class="filter-btn" data-filter="completed">
        <span class="filter-icon">◎</span> Completed
        <span class="filter-count" id="count-completed">0</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <p class="sidebar-date" id="today-date"></p>
    </div>
  </aside>

  <!-- ░░ MAIN ░░ -->
  <main class="main">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <h2 class="page-title" id="page-title">All Tasks</h2>
      </div>
      <div class="topbar-right">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" placeholder="Search tasks…" autocomplete="off" />
        </div>
        <button class="btn-add" id="btn-open-modal">+ New Task</button>
      </div>
    </header>

    <!-- Task list -->
    <section class="task-section">
      <div id="task-list" class="task-list"></div>
      <div id="empty-state" class="empty-state hidden">
        <span class="empty-icon">◫</span>
        <p>No tasks found</p>
        <small>Click <strong>+ New Task</strong> to get started</small>
      </div>
    </section>
  </main>

  <!-- ░░ MODAL ░░ -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">New Task</h3>
        <button class="modal-close" id="btn-close-modal" aria-label="Close">✕</button>
      </div>

      <form id="task-form" novalidate>
        <input type="hidden" id="task-id" />

        <div class="form-group">
          <label for="task-title">Title <span class="required">*</span></label>
          <input type="text" id="task-title" placeholder="What needs to be done?" maxlength="120" required />
          <span class="field-error" id="error-title"></span>
        </div>

        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" placeholder="Add more details…" rows="3" maxlength="500"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-due">Due Date</label>
            <input type="date" id="task-due" />
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="btn-submit">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ░░ DELETE CONFIRM ░░ -->
  <div class="modal-overlay hidden" id="confirm-overlay">
    <div class="modal modal--confirm">
      <p>Are you sure you want to delete this task?</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="btn-cancel-delete">Cancel</button>
        <button class="btn-danger" id="btn-confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- ░░ TOAST ░░ -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="/static/script.js"></script>
</body>
</html>
